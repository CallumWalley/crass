[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "crass"
authors = [{name = "cal"}]
dynamic = ["version"]
dependencies = [
    "jinja2",
    "pdfkit",
    "python-slugify",
    "pyyaml"
]
[project.scripts]
crass = "crass.cli:main"
